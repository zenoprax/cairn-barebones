title: Cairn (Barebones)
description: A player-focused reference for playing Cairn with the Barebones rules.
lang: en-US
permalink: pretty
theme: just-the-docs
url: ""
baseurl: ""
logo: "/img/logo.svg"
color_scheme: cairn
encoding: UTF-8

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-dice-tray
  - jekyll-image-links
  - rpg-callouts
  - jekyll-titles-from-headings

search:
  # Split pages into sections that can be searched individually
  # Supports 1 - 6, default: 2
  heading_level: 3
  # Maximum amount of previews per search result
  # Default: 3
  previews: 2
  # Maximum amount of words to display before a matched word in the preview
  # Default: 5
  preview_words_before: 3
  # Maximum amount of words to display after a matched word in the preview
  # Default: 10
  preview_words_after: 3
  # Focus the search input by pressing `ctrl + focus_shortcut_key` (or `cmd + focus_shortcut_key` on macOS)
  focus_shortcut_key: "k"

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

sass:
  quiet_deps: true # JTD deprecation warnings from their own theme. Less noise.
  silence_deprecations: ["import", "global-builtin", "color-functions"]

# jekyll-dice-tray still links the dice in the text; the redesign's own dice (assets/js/cairn-dice.js) roll them
dice_tray:
  inject_tray: false

defaults:
  # the picture a link to any page shows when it is shared, unless the page sets its own `image:`
  - scope:
      path: ""
    values:
      image:
        path: /assets/redesign/players-guide-cover.jpg
        width: 1920
        height: 992
        alt: "Three adventurers in the branches of a great tree, fending off a horned beast that climbs toward them through a red forest."
  # the redesign's sheet PDFs are files, not pages: keep them out of sitemap.xml
  - scope:
      path: "assets/redesign"
    values:
      sitemap: false
